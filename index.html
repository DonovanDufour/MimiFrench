<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>ミミとフランスご</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lilita+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: a child's travel sticker-book — a sky-blue page, chunky tappable "stops" on a journey, one cat guide with a beret. */
:root{
  --sky:#E8F1FF; --paper:#FFFFFF; --ink:#1D2550; --muted:#56608E; --line:#C8D5F3;
  --blue:#2F55D4; --red:#EF4B4B; --yellow:#FFC93C; --green:#22AE6B; --pink:#FF73B0; --violet:#8A5CF0; --orange:#FF8A3D;
  --btn-ink:#1D2550; --on-strong:#FFFFFF; --shadow:rgba(29,37,80,.16); --glow:rgba(255,201,60,.55);
  --font-fr:"Fredoka","Zen Maru Gothic",system-ui,sans-serif;
  --font-ja:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Meiryo",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --sky:#111A3B; --paper:#1C2655; --ink:#F2F5FF; --muted:#AFB9E8; --line:#33417E;
  --blue:#7C9BFF; --red:#FF6B6B; --yellow:#FFD45C; --green:#43D08C; --pink:#FF8DC2; --violet:#B497FF; --orange:#FFA061;
  --btn-ink:#1D2550; --on-strong:#111A3B; --shadow:rgba(0,0,0,.4); --glow:rgba(255,212,92,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --sky:#111A3B; --paper:#1C2655; --ink:#F2F5FF; --muted:#AFB9E8; --line:#33417E;
  --blue:#7C9BFF; --red:#FF6B6B; --yellow:#FFD45C; --green:#43D08C; --pink:#FF8DC2; --violet:#B497FF; --orange:#FFA061;
  --btn-ink:#1D2550; --on-strong:#111A3B; --shadow:rgba(0,0,0,.4); --glow:rgba(255,212,92,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--sky); color:var(--ink); font-family:var(--font-ja); font-size:17px; line-height:1.6;
  background-image:radial-gradient(circle at 12% 8%, color-mix(in srgb,var(--paper) 60%,transparent) 0 70px, transparent 71px),
                   radial-gradient(circle at 88% 30%, color-mix(in srgb,var(--paper) 45%,transparent) 0 90px, transparent 91px);
  background-attachment:fixed;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.fr{font-family:var(--font-fr)}

/* ---------- header ---------- */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);box-shadow:0 2px 0 var(--line)}
.bunting{height:10px;background:repeating-linear-gradient(90deg,var(--blue) 0 22px,var(--paper) 22px 44px,var(--red) 44px 66px)}
.hbar{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1.15rem;letter-spacing:.02em;margin-right:auto;min-width:0}
.logo svg{width:40px;height:40px;flex:none}
.logo small{display:block;font-family:var(--font-fr);font-weight:600;font-size:.78rem;color:var(--muted);line-height:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--sky);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.star{border-color:var(--yellow)}
.pill.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25)}}
.iconbtn{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;background:var(--yellow);color:var(--btn-ink);font-weight:900;box-shadow:0 3px 0 color-mix(in srgb,var(--yellow) 60%,#000)}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--yellow) 60%,#000)}
.toggle{background:var(--sky);color:var(--ink);border:2px solid var(--line);box-shadow:none;font-size:.85rem}
.toggle[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--btn-ink)}
@media (max-width:560px){ .logo .ttl{display:none} .hbar{gap:8px} .iconbtn .lbl{display:none} }

main{max-width:980px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
section.screen{animation:in .35s ease-out}
@keyframes in{from{transform:translateY(10px);opacity:.4}}

/* ---------- mascot ---------- */
.hello{display:flex;align-items:flex-end;gap:14px;margin-bottom:22px}
.mimi{width:120px;height:120px;flex:none;animation:bob 3s ease-in-out infinite;transform-origin:50% 100%}
.mimi.jump{animation:jump .6s ease-out}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
@keyframes jump{30%{transform:translateY(-26px) scale(1.05)}60%{transform:translateY(0) scale(1.05,.92)}}
.bubble{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:22px;padding:14px 18px;font-weight:700;min-width:0;flex:1;box-shadow:0 5px 0 var(--shadow)}
.bubble::before{content:"";position:absolute;left:-14px;bottom:22px;border:12px solid transparent;border-right-color:var(--ink);border-left:0}
.bubble::after{content:"";position:absolute;left:-9px;bottom:25px;border:9px solid transparent;border-right-color:var(--paper);border-left:0}
.bubble .fr{font-size:1.5rem;color:var(--blue);font-weight:700}
.speak{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;background:var(--blue);color:var(--on-strong);font-weight:900;padding:6px 14px;box-shadow:0 4px 0 color-mix(in srgb,var(--blue) 55%,#000);vertical-align:middle}
.speak:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--blue) 55%,#000)}
.speak.slow{background:var(--green);color:var(--btn-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--green) 55%,#000)}

/* ---------- daily word ---------- */
.daily{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;background:var(--paper);border-radius:24px;padding:14px 18px;margin-bottom:26px;border:3px dashed var(--line)}
.daily .tag{font-size:.8rem;font-weight:900;color:var(--muted);letter-spacing:.08em}
.daily .w{font-family:var(--font-fr);font-size:1.7rem;font-weight:700;line-height:1.2}
.daily .p{font-size:2.6rem;line-height:1}
@media (max-width:480px){.daily{grid-template-columns:auto 1fr}.daily .speak{grid-column:1/-1}}

/* ---------- journey map ---------- */
h2{font-size:1.35rem;font-weight:900;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px;font-weight:700}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px;counter-reset:stop}
.stop{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;border-radius:28px;padding:18px 18px 14px;background:var(--paper);border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);transition:transform .15s}
.stop:hover{transform:translateY(-3px) rotate(-.6deg)}
.stop:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.stop .ic{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-size:2.3rem;background:var(--tc)}
.stop .ja{font-size:1.25rem;font-weight:900}
.stop .fr{color:var(--muted);font-weight:600;font-size:1rem;line-height:1}
.stop .badges{display:flex;gap:4px;margin-top:6px}
.stop .badges span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:.95rem;background:var(--sky);filter:grayscale(1);opacity:.45}
.stop .badges span.on{filter:none;opacity:1;background:color-mix(in srgb,var(--yellow) 45%,var(--paper))}
.stop .num{position:absolute;top:14px;right:16px;font-family:var(--font-fr);font-weight:700;color:var(--muted);font-size:.9rem}
.stop.complete::after{content:"✨";position:absolute;top:-12px;right:-6px;font-size:1.6rem}

.parent{margin-top:34px;font-size:.85rem;color:var(--muted);border-top:2px dashed var(--line);padding-top:14px;max-width:70ch}
.parent b{color:var(--ink)}
.voicebox{margin-top:14px;display:flex;flex-direction:column;gap:8px;background:var(--paper);border-radius:16px;padding:12px 14px;border:2px solid var(--line)}
.voicebox select{font:inherit;color:var(--ink);background:var(--sky);border:2px solid var(--line);border-radius:12px;padding:6px 10px;max-width:100%;min-width:0;flex:1 1 220px}
.voicebox #voiceTip{color:var(--ink)}
.voicewarn{background:color-mix(in srgb,var(--orange) 20%,var(--paper));border:2px solid var(--orange);border-radius:16px;padding:10px 14px;margin-bottom:18px;font-weight:700;font-size:.92rem}

/* ---------- theme / activities ---------- */
.back{display:inline-flex;align-items:center;gap:6px;font-weight:900;padding:6px 14px;border-radius:999px;background:var(--paper);border:2px solid var(--line);margin-bottom:16px}
.thead{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.thead .ic{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font-size:2.8rem;background:var(--tc);flex:none}
.thead h2{font-size:1.7rem;margin:0}
.thead .fr{color:var(--muted);font-size:1.15rem;font-weight:600}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.act{display:flex;align-items:center;gap:14px;text-align:left;border-radius:24px;padding:18px;background:var(--ac);color:var(--btn-ink);box-shadow:0 6px 0 color-mix(in srgb,var(--ac) 55%,#000);font-weight:900;font-size:1.15rem;line-height:1.3}
.act:hover{transform:translateY(-2px)}
.act:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--ac) 55%,#000)}
.act .e{font-size:2.4rem;width:58px;height:58px;display:grid;place-items:center;background:rgba(255,255,255,.55);border-radius:18px;flex:none}
.act small{display:block;font-weight:700;font-size:.85rem;opacity:.85}
.act .done{margin-left:auto;font-size:1.4rem}

/* ---------- shared pic ---------- */
.emoji{line-height:1;display:inline-block}
.swatch{display:inline-block;width:1em;height:1em;border-radius:38% 62% 55% 45%/50% 40% 60% 50%;background:var(--sw);border:3px solid var(--ink)}
.digit{display:inline-grid;place-items:center;width:1.15em;height:1.15em;border-radius:50%;background:var(--yellow);color:var(--btn-ink);font-family:var(--font-fr);font-weight:700;font-size:.85em;line-height:1}

/* ---------- learn card ---------- */
.stage{display:flex;flex-direction:column;align-items:center;gap:16px}
.progress{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.progress i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.progress i.on{background:var(--yellow)}
.progress i.ok{background:var(--green)}
.progress i.cur{outline:3px solid var(--blue);outline-offset:2px}
.card{width:min(420px,100%);background:var(--paper);border:4px solid var(--ink);border-radius:32px;padding:26px 20px 22px;text-align:center;box-shadow:0 8px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:8px}
.card .bigpic{font-size:7rem;line-height:1.05;cursor:pointer}
.card .count{font-size:1.6rem;letter-spacing:2px;min-height:1.6em}
.card .word{font-family:var(--font-fr);font-size:2.6rem;font-weight:700;line-height:1.1;color:var(--blue);overflow-wrap:anywhere}
.card .word .art{font-size:.65em;color:var(--muted);font-weight:600}
.card .kana{font-size:1.15rem;font-weight:900;color:var(--pink);min-height:1.6em}
.card .ja{font-size:1.15rem;font-weight:700;background:var(--sky);border-radius:999px;padding:2px 14px}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.nav{border-radius:999px;padding:12px 24px;font-weight:900;font-size:1.1rem;background:var(--paper);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
.nav.go{background:var(--red);color:var(--on-strong);border-color:var(--red);box-shadow:0 4px 0 color-mix(in srgb,var(--red) 55%,#000)}
.nav:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.nav:disabled{opacity:.35;cursor:default}
.pop{animation:popin .35s cubic-bezier(.3,1.6,.6,1)}
@keyframes popin{from{transform:scale(.7);opacity:.3}}

/* ---------- quiz ---------- */
.ask{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.bigspeak{width:110px;height:110px;border-radius:50%;font-size:3rem;background:var(--blue);color:var(--on-strong);box-shadow:0 7px 0 color-mix(in srgb,var(--blue) 55%,#000)}
.bigspeak:active{transform:translateY(5px);box-shadow:0 2px 0 color-mix(in srgb,var(--blue) 55%,#000)}
.bigspeak.ping{animation:ping 1s}
@keyframes ping{0%{box-shadow:0 7px 0 color-mix(in srgb,var(--blue) 55%,#000),0 0 0 0 var(--glow)}100%{box-shadow:0 7px 0 color-mix(in srgb,var(--blue) 55%,#000),0 0 0 26px transparent}}
.ask .word{font-family:var(--font-fr);font-size:2.1rem;font-weight:700;color:var(--blue);line-height:1.1}
.ask .kana{color:var(--pink);font-weight:900;min-height:1.5em}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;width:min(460px,100%)}
.choice{aspect-ratio:1.25;max-width:100%;border-radius:26px;background:var(--paper);border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);font-size:4.2rem;display:grid;place-items:center;transition:transform .12s}
.choice:hover{transform:translateY(-2px)}
.choice.right{background:color-mix(in srgb,var(--green) 35%,var(--paper));border-color:var(--green);animation:yay .5s}
.choice.wrong{background:color-mix(in srgb,var(--red) 22%,var(--paper));border-color:var(--red);animation:shake .4s;opacity:.55}
@keyframes yay{40%{transform:scale(1.1) rotate(3deg)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* ---------- memory ---------- */
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:min(620px,100%)}
@media (max-width:520px){.mgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mcard{display:block;width:100%;padding:0;aspect-ratio:3/4;perspective:700px;max-width:100%}
.mcard .in{display:block;position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mcard.flip .in{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;border-radius:18px;border:3px solid var(--ink);display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:6px;text-align:center}
.mcard .b{background:var(--red);background-image:radial-gradient(circle,rgba(255,255,255,.35) 3px,transparent 4px);background-size:16px 16px;font-size:2rem;color:var(--on-strong);font-weight:900;box-shadow:0 4px 0 var(--ink)}
.mcard .f{background:var(--paper);transform:rotateY(180deg)}
.mcard .f .emoji,.mcard .f .swatch,.mcard .f .digit{font-size:2.8rem}
.mcard .f .w{font-family:var(--font-fr);font-weight:700;font-size:clamp(.95rem,3.6vw,1.3rem);line-height:1.15;color:var(--blue);overflow-wrap:anywhere}
.mcard .f .w small{display:block;color:var(--pink);font-family:var(--font-ja);font-size:.7em;font-weight:900}
.mcard.match .f{background:color-mix(in srgb,var(--green) 30%,var(--paper));border-color:var(--green);animation:yay .5s}

/* ---------- balloons ---------- */
.sky{position:relative;width:100%;height:380px;border-radius:30px;overflow:hidden;border:4px solid var(--ink);
  background:linear-gradient(var(--sky),color-mix(in srgb,var(--blue) 18%,var(--sky)))}
.sky::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40px;background:radial-gradient(ellipse at 20% 100%,var(--green) 0 60%,transparent 61%),radial-gradient(ellipse at 75% 110%,var(--green) 0 55%,transparent 56%);opacity:.8}
.balloon{position:absolute;bottom:-160px;width:min(88px,18vw);transform:translateX(-50%);animation:rise 1.1s cubic-bezier(.2,.8,.3,1) forwards}
.balloon .bb{position:relative;width:100%;aspect-ratio:.85;border-radius:50% 50% 48% 48%/55% 55% 45% 45%;background:var(--bc);display:grid;place-items:center;font-size:min(2.6rem,8vw);box-shadow:inset -8px -10px 0 rgba(0,0,0,.12),inset 8px 8px 0 rgba(255,255,255,.35);animation:bob2 2.6s ease-in-out infinite;animation-delay:var(--d)}
.balloon .bb::after{content:"";position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);border:7px solid transparent;border-bottom-color:var(--bc);border-top:0}
.balloon .str{display:block;width:2px;height:60px;margin:6px auto 0;background:var(--muted)}
.balloon .swatch{font-size:1em}
@keyframes rise{to{bottom:var(--y)}}
@keyframes bob2{50%{transform:translateY(-10px) rotate(3deg)}}
.balloon.burst .bb{animation:burst .35s forwards}
.balloon.burst .str{opacity:0;transition:opacity .2s}
@keyframes burst{to{transform:scale(1.6);opacity:0}}
.balloon.nope .bb{animation:shake .4s}

/* ---------- stickers ---------- */
.book{background:var(--paper);border-radius:28px;border:3px solid var(--ink);padding:18px;box-shadow:0 6px 0 var(--ink)}
.meter{height:20px;border-radius:999px;background:var(--sky);border:2px solid var(--line);overflow:hidden;margin:6px 0 18px}
.meter i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--yellow) 0 12px,color-mix(in srgb,var(--yellow) 75%,var(--orange)) 12px 24px);transition:width .5s}
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:12px}
.sticker{aspect-ratio:1;border-radius:22px;display:grid;place-items:center;font-size:2.6rem;background:var(--sky);border:3px dashed var(--line);color:var(--muted)}
.sticker.got{border:3px solid var(--ink);background:var(--paper);box-shadow:0 4px 0 var(--ink);transform:rotate(var(--r))}
.sticker.lock{font-size:1.4rem;font-weight:900}

/* ---------- modal & toast ---------- */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(17,26,59,.45);padding:16px}
.modal .box{background:var(--paper);border:4px solid var(--ink);border-radius:32px;padding:26px 22px;text-align:center;max-width:380px;width:100%;box-shadow:0 8px 0 var(--ink);animation:popin .4s cubic-bezier(.3,1.6,.6,1)}
.modal h3{font-size:1.8rem;margin:0;font-weight:900}
.modal .big{font-size:4rem;line-height:1.2}
.modal p{font-weight:700;margin:6px 0 16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:999px;font-weight:900;animation:popin .3s;white-space:nowrap}
#fx{position:fixed;inset:0;pointer-events:none;z-index:90;width:100%;height:100%}

/* ---------- launch splash ---------- */
.splash{position:fixed;inset:0;z-index:80;display:flex;overflow-x:hidden;overflow-y:auto;
  background:radial-gradient(circle at 50% 110%,color-mix(in srgb,var(--yellow) 35%,var(--sky)) 0 30%,transparent 60%),linear-gradient(var(--sky),color-mix(in srgb,var(--blue) 22%,var(--sky)));
  padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.splash.out{animation:spOut .6s ease-in forwards;pointer-events:none}
@keyframes spOut{to{opacity:0;transform:scale(1.12)}}
.sp-bunting{position:absolute;top:0;left:0;right:0;height:34px;background:
  conic-gradient(from 135deg at 50% 100%,var(--blue) 0 90deg,transparent 0) 0 0/66px 34px repeat-x;
  filter:drop-shadow(0 3px 0 var(--shadow));animation:spDrop .7s cubic-bezier(.3,1.5,.5,1) both}
.sp-bunting::after{content:"";position:absolute;inset:0;background:conic-gradient(from 135deg at 50% 100%,var(--red) 0 90deg,transparent 0) 33px 0/66px 34px repeat-x}
@keyframes spDrop{from{transform:translateY(-100%)}}
.sp-float{position:absolute;bottom:-60px;font-size:2.4rem;opacity:.85;animation:spFloat var(--du) linear var(--dl) infinite}
@keyframes spFloat{to{transform:translateY(calc(-100vh - 120px)) rotate(25deg)}}
.sp-skip{position:absolute;top:calc(44px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));font-weight:900;color:var(--muted);padding:6px 12px;border-radius:999px}
.sp-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;width:min(520px,100%);margin:auto}
.splash.talking .sp-title,.splash.talking .sp-sub{display:none}
.splash.talking .sp-stage{gap:22px}
.sp-title{font-weight:900;font-size:clamp(2.4rem,10vw,3.8rem);line-height:1.08;color:var(--ink);letter-spacing:.04em}
.sp-title span{display:inline-block;animation:spLetter .6s cubic-bezier(.3,1.7,.5,1) both;animation-delay:calc(.08s * var(--i) + .2s)}
.sp-title span:nth-child(odd){color:var(--blue)} .sp-title span:nth-child(3n){color:var(--red)}
@keyframes spLetter{from{transform:translateY(-40px) scale(.3);opacity:0}}
.sp-sub{font-weight:600;color:var(--muted);font-size:1.1rem;animation:in .5s 1s both}
.sp-mimi{width:min(200px,46vw,30vh);height:auto;aspect-ratio:1;max-width:100%;transform-origin:50% 100%;animation:spIn 1s cubic-bezier(.3,1.5,.5,1) .6s both}
@keyframes spIn{from{transform:translateY(140%) rotate(-12deg)}}
.sp-mimi.talk{animation:spTalk .26s ease-in-out infinite alternate}
@keyframes spTalk{from{transform:rotate(-2deg)}to{transform:scale(1.05,.94) rotate(2deg)}}
.sp-mimi.hop{animation:jump .6s ease-out 2}
.sp-bubble{position:relative;background:var(--paper);border:4px solid var(--ink);border-radius:24px;padding:14px 20px;box-shadow:0 6px 0 var(--shadow);animation:popin .35s cubic-bezier(.3,1.6,.6,1);width:100%}
.sp-bubble::before{content:"";position:absolute;top:-17px;left:50%;transform:translateX(-50%);border:14px solid transparent;border-bottom-color:var(--ink);border-top:0}
.sp-bubble::after{content:"";position:absolute;top:-11px;left:50%;transform:translateX(-50%);border:11px solid transparent;border-bottom-color:var(--paper);border-top:0}
.sp-bubble .fr{font-size:clamp(1.25rem,5vw,1.6rem);font-weight:700;color:var(--blue);line-height:1.3;min-height:1.3em}
.sp-bubble .ja{font-weight:700;color:var(--muted);margin-top:6px;animation:in .4s both}
.sp-btn{margin-top:6px;border-radius:999px;padding:16px 30px;font-weight:900;font-size:1.25rem;background:var(--red);color:var(--on-strong);box-shadow:0 6px 0 color-mix(in srgb,var(--red) 55%,#000);animation:spPulse 1.6s ease-in-out 1.6s infinite both}
.sp-btn.yes{background:var(--green);color:var(--btn-ink);box-shadow:0 6px 0 color-mix(in srgb,var(--green) 55%,#000);animation:popin .4s cubic-bezier(.3,1.6,.6,1), spPulse 1.6s ease-in-out .6s infinite}
.sp-btn:active{transform:translateY(4px)}
@keyframes spPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* ---------- ⚡ Mini Français (WarioWare-style micro-games) ----------
   Comic look: each game has its own loud background, a black instruction pill, a clock,
   and a bottom bar with the fuse + lives. The arena always uses light colours so it reads like a comic panel. */
:root{ --font-pop:"Lilita One","Fredoka","Zen Maru Gothic",system-ui,sans-serif; --mf-ink:#15122C; --mf-frame:#15122C; --mf-gold:#FFD23F; --mf-hot:#FF5FB0; }
.wwbanner{width:100%;display:flex;align-items:center;gap:14px;text-align:left;margin-bottom:26px;padding:16px 18px;border-radius:28px;border:4px solid #000;color:#15122C;
  background:repeating-conic-gradient(from 0deg at 18% 50%,#FFC53D 0 9deg,#FF8A1F 9deg 18deg);box-shadow:0 6px 0 #000}
.wwbanner:active{transform:translateY(4px);box-shadow:0 2px 0 #000}
.wwbanner .bolt{font-size:2.4rem;width:64px;height:64px;flex:none;display:grid;place-items:center;border-radius:50%;background:#fff;border:3px solid #000}
.wwbanner b{display:block;font-family:var(--font-pop);font-weight:400;font-size:1.6rem;line-height:1.1;color:var(--mf-gold);-webkit-text-stroke:2px #000;paint-order:stroke fill;text-shadow:0 3px 0 #000}
.wwbanner small{display:block;font-weight:900;font-size:.85rem;line-height:1.4;margin-top:4px;background:rgba(255,255,255,.85);border-radius:10px;padding:2px 8px;width:fit-content}
.wwbanner .go{margin-left:auto;font-size:1.4rem;width:50px;height:50px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--red);color:#fff;border:3px solid #000}

body.ww-on{overflow:hidden}
.ww{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:var(--mf-frame);color:#fff;touch-action:manipulation;user-select:none;-webkit-user-select:none;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.ww-top{display:flex;align-items:center;gap:8px;padding:8px 12px}
.ww-pts{font-family:var(--font-pop);font-size:1.35rem;color:var(--mf-gold);margin-right:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.ww-pts small{font-size:.75em;color:var(--mf-hot);margin-left:8px}
.ww-ic{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:1.15rem;font-weight:900}
.ww-ic[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.ww-arena{--paper:#fff;--ink:#15122C;--line:#C8D5F3;--sky:#E8F1FF;--blue:#2F55D4;--muted:#56608E;--pink:#E0337E;--green:#22AE6B;--red:#EF4B4B;--yellow:#FFC93C;--on-strong:#fff;--btn-ink:#15122C;
  position:relative;flex:1;min-height:0;margin:0 10px;border:4px solid #000;border-radius:22px;overflow:hidden;color:var(--ink);background:#69D2FF}
.mf-play{position:absolute;inset:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:12px;padding:70px 14px 16px;text-align:center}
/* instruction pill + clock */
.mf-title{position:absolute;top:10px;left:10px;z-index:5;max-width:calc(100% - 110px);text-align:left;background:rgba(21,18,44,.9);color:#fff;font-family:var(--font-pop);font-size:clamp(1.05rem,4.6vw,1.5rem);line-height:1.15;padding:7px 16px;border-radius:16px}
.mf-title small{display:block;font-family:var(--font-ja);font-weight:700;font-size:.6em;opacity:.85}
.mf-clock{position:absolute;top:8px;right:12px;z-index:5;display:flex;align-items:center;gap:6px;font-family:var(--font-pop);font-size:2.3rem;line-height:1;color:#fff;-webkit-text-stroke:2px #000;paint-order:stroke fill;text-shadow:0 3px 0 #000;font-variant-numeric:tabular-nums}
.mf-clock i{position:relative;width:34px;height:34px;border-radius:50%;background:#fff;border:3px solid #000;box-shadow:0 3px 0 #000}
.mf-clock i::before,.mf-clock i::after{content:"";position:absolute;left:50%;top:50%;width:3px;background:#000;border-radius:2px;transform-origin:50% 0}
.mf-clock i::before{height:10px;transform:translateX(-50%) rotate(180deg)}
.mf-clock i::after{height:8px;transform:translateX(-50%) rotate(-90deg)}
.mf-clock.hurry{color:#FF4B4B;animation:hurry2 .3s infinite alternate}
@keyframes hurry2{to{transform:scale(1.15)}}
/* bottom bar */
.ww-bot{display:flex;align-items:center;gap:10px;padding:8px 12px 10px;flex-wrap:wrap}
.ww-bot .mm{width:38px;height:38px;flex:none}
.ww-bar{flex:1 1 120px;height:22px;border-radius:999px;border:3px solid #fff;background:#000;overflow:hidden}
.ww-bar i{display:block;height:100%;width:100%;border-radius:999px;background:linear-gradient(#FFE45C,#FFB800)}
.ww-bar.hurry i{background:linear-gradient(#FF7A7A,#E52A3C)}
.ww-left{font-family:var(--font-pop);font-size:1.25rem;color:var(--mf-hot);white-space:nowrap}
.ww-left b{font-weight:400;color:var(--mf-gold);font-size:1.45em;margin:0 4px;font-variant-numeric:tabular-nums}
.ww-lives{display:flex;gap:2px}
.ww-lives svg{width:30px;height:30px}
.ww-lives .lost{filter:grayscale(1);opacity:.25}
.ww-lives .break{animation:hbreak .6s}
@keyframes hbreak{30%{transform:scale(1.6) rotate(-15deg)}}
.ww-bot.idle .ww-bar,.ww-bot.idle .ww-left{visibility:hidden}
@media (max-width:560px){ .ww-left{order:-1;flex-basis:100%;text-align:center} }
/* comic backgrounds */
.bg-swirl{background:repeating-conic-gradient(from 0deg at 62% 42%,#FF4FB3 0 12deg,#D6249A 12deg 24deg)}
.bg-burst{background:repeating-conic-gradient(from 0deg at 28% 55%,#FFC53D 0 9deg,#FF8A1F 9deg 18deg)}
.bg-sky{background:radial-gradient(ellipse 22% 9% at 16% 22%,#fff 60%,transparent 63%),radial-gradient(ellipse 18% 8% at 82% 32%,#fff 60%,transparent 63%),radial-gradient(ellipse 14% 6% at 52% 14%,#fff 60%,transparent 63%),linear-gradient(#7ADBFF,#2F7BFF)}
.bg-grass{background:radial-gradient(circle,rgba(255,255,255,.28) 0 5px,transparent 6px) 0 0/36px 36px,linear-gradient(#B2EA5E,#45B33A)}
.bg-alarm{background:repeating-conic-gradient(from 0deg at 50% 50%,#FF5A4F 0 10deg,#E52A3C 10deg 20deg)}
.bg-violet{background:repeating-conic-gradient(from 0deg at 18% 62%,#9B6BFF 0 10deg,#7442F0 10deg 20deg)}
.bg-meadow{background:radial-gradient(ellipse 55% 22% at 22% 100%,#3FA53A 60%,transparent 61%),radial-gradient(ellipse 50% 18% at 85% 100%,#3FA53A 60%,transparent 61%),linear-gradient(#86DCFF 0 64%,#6CCB4C 64%)}
.bg-rainbow{background:repeating-conic-gradient(from 0deg at 50% 50%,#FF4FB3 0 9deg,#FFD23F 9deg 18deg,#4FD1FF 18deg 27deg,#7CF06B 27deg 36deg)}
.bg-teal{background:repeating-conic-gradient(from 0deg at 70% 60%,#3FE0CB 0 10deg,#16B3A8 10deg 20deg)}
.bg-lemon{background:repeating-conic-gradient(from 0deg at 40% 40%,#FFE45C 0 10deg,#FFC81F 10deg 20deg)}
.bg-peach{background:repeating-conic-gradient(from 0deg at 50% 70%,#FFB199 0 10deg,#FF8673 10deg 20deg)}
.bg-mint{background:repeating-conic-gradient(from 0deg at 30% 30%,#8BF2CF 0 10deg,#45D6A6 10deg 20deg)}
.bg-candy{background:repeating-conic-gradient(from 0deg at 60% 60%,#FFD1EA 0 10deg,#FF9FD0 10deg 20deg)}
.bg-boss{background:repeating-conic-gradient(from 0deg at 50% 50%,#4A2496 0 10deg,#2A135C 10deg 20deg)}
/* stage / instruction / result screens */
.ww-stage{position:absolute;inset:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:10px;padding:20px 16px;text-align:center}
.mf-big{font-family:var(--font-pop);font-size:clamp(3.6rem,18vw,6.5rem);line-height:1;color:#fff;-webkit-text-stroke:4px #000;paint-order:stroke fill;text-shadow:0 7px 0 #000;animation:popin .4s cubic-bezier(.3,1.6,.6,1)}
.mf-cmd{font-family:var(--font-pop);font-size:clamp(2.2rem,10vw,4.2rem);line-height:1.08;color:#fff;-webkit-text-stroke:4px #000;paint-order:stroke fill;text-shadow:0 7px 0 #000;animation:cmd .45s cubic-bezier(.3,1.7,.5,1);text-wrap:balance;max-width:16ch}
.mf-cmd .e{display:block;font-size:1.2em;-webkit-text-stroke:0;text-shadow:none}
.mf-sub{font-family:var(--font-ja);font-weight:900;font-size:1.05rem;background:rgba(21,18,44,.88);color:#fff;border-radius:999px;padding:4px 16px}
@keyframes cmd{from{transform:scale(2.4) rotate(-8deg);opacity:0}}
.mf-tag{display:inline-block;font-family:var(--font-pop);font-size:1.15rem;background:var(--red);color:#fff;border:3px solid #000;border-radius:999px;padding:4px 16px;box-shadow:0 4px 0 #000;animation:popin .4s cubic-bezier(.3,1.6,.6,1)}
.mf-tag.gold{background:#FF8A1F}
.ww-ans{background:#fff;border:4px solid #000;border-radius:24px;padding:12px 22px;box-shadow:0 6px 0 #000;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mf-ink)}
.ww-ans .p{font-size:4rem;line-height:1.1}
.ww-ans .word{font-family:var(--font-fr);font-size:2rem;font-weight:700;color:var(--blue);line-height:1.15}
.ww-ans .word .art{font-size:.65em;color:var(--muted)}
.ww-ans .kana{color:var(--pink);font-weight:900}
.ww-words{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:460px}
.ww-words span{background:#fff;border:3px solid #000;border-radius:999px;padding:3px 12px;font-family:var(--font-fr);font-weight:700;color:var(--mf-ink)}
/* cool Mimi (with sunglasses) */
.mf-mimi{position:relative;display:inline-block;width:var(--s,120px);height:var(--s,120px);flex:none}
.mf-mimi svg{width:100%;height:100%;display:block;animation:bob 2.4s ease-in-out infinite;transform-origin:50% 100%}
.mf-mimi .shades{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);font-size:calc(var(--s,120px)*.42);line-height:1}
.mf-mimi.jump svg{animation:jump .6s ease-out 2}
/* title screen */
.mf-logo{position:relative;display:flex;flex-direction:column;align-items:center;line-height:.95;transform:rotate(-4deg);animation:popin .6s cubic-bezier(.3,1.6,.6,1)}
.mf-logo span{font-family:var(--font-pop);color:var(--mf-gold);-webkit-text-stroke:5px #000;paint-order:stroke fill;text-shadow:0 7px 0 #C2185B}
.mf-logo .l1{font-size:clamp(2.8rem,13vw,4.6rem)}
.mf-logo .l2{font-size:clamp(3.4rem,16vw,6rem)}
.mf-logo .star{position:absolute;left:-18px;top:-16px;font-size:2.6rem;-webkit-text-stroke:0;text-shadow:none;animation:spin 6s linear infinite}
.mf-logo .flag{position:absolute;right:-14px;top:-22px;font-size:2.4rem;-webkit-text-stroke:0;text-shadow:none}
@keyframes spin{to{transform:rotate(360deg)}}
.mf-ribbon{font-family:var(--font-pop);font-size:clamp(1.05rem,4.6vw,1.4rem);background:#2B2A7E;color:#fff;border:3px solid #000;border-radius:999px;padding:5px 18px;transform:rotate(-2deg)}
.mf-menu{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:6px}
.mf-play-btn{font-family:var(--font-pop);font-size:2.2rem;color:var(--mf-ink);background:var(--mf-gold);border:0;padding:22px 46px;
  clip-path:polygon(50% 0,58% 14%,74% 4%,76% 20%,94% 16%,88% 32%,100% 42%,88% 54%,98% 70%,80% 70%,80% 88%,64% 80%,54% 100%,44% 82%,28% 94%,26% 76%,6% 80%,14% 62%,0 50%,14% 38%,4% 22%,22% 22%,24% 4%,40% 14%);
  filter:drop-shadow(0 5px 0 #000);animation:spPulse 1.4s ease-in-out infinite}
.mf-pill{font-family:var(--font-pop);font-size:1.25rem;color:#fff;background:#6A35E0;border:3px solid #000;border-radius:999px;padding:6px 26px;box-shadow:0 4px 0 #000;min-width:170px}
.mf-pill:active,.mf-btn:active{transform:translateY(3px)}
.mf-opts{display:flex;flex-direction:column;gap:8px;background:rgba(21,18,44,.9);color:#fff;border-radius:18px;padding:12px 16px;font-weight:900}
.mf-opts button{font-family:var(--font-pop);font-size:1.05rem;color:#fff;background:rgba(255,255,255,.14);border-radius:12px;padding:6px 14px;text-align:left}
.mf-stats{font-family:var(--font-ja);font-weight:900;font-size:.9rem;background:rgba(255,255,255,.88);color:var(--mf-ink);border-radius:999px;padding:3px 14px}
.mf-deco{position:absolute;pointer-events:none;line-height:1}
/* shared game pieces */
.mf-btn{font-family:var(--font-pop);font-size:clamp(1.15rem,5vw,1.6rem);background:#FFFBEA;color:var(--mf-ink);border:4px solid #000;border-radius:16px;box-shadow:0 5px 0 #000;padding:8px 16px;line-height:1.1}
.mf-btn small{display:block;font-family:var(--font-ja);font-size:.55em;color:var(--pink);margin-top:2px}
.mf-btn.right{background:#9DFF8A;animation:yay .5s}
.mf-btn.wrong{background:#FF9A9A;animation:shake .4s}
.mf-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.mf-hero{display:flex;align-items:center;justify-content:center;gap:8px}
.mf-bubble{position:relative;background:#fff;border:4px solid #000;border-radius:50%;padding:22px 34px;font-size:clamp(3.6rem,17vw,5.4rem);line-height:1;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.mf-bubble::before{content:"";position:absolute;left:-16px;bottom:22%;border:14px solid transparent;border-right-color:#000;border-left:0}
.mf-bubble .swatch{border-width:5px}
.ww-q{display:flex;align-items:center;gap:12px;justify-content:center;background:#fff;border:4px solid #000;border-radius:20px;padding:8px 16px 8px 8px;box-shadow:0 5px 0 #000}
.ww-q .bigspeak{width:62px;height:62px;font-size:1.8rem;flex:none}
.ww-q .word{font-family:var(--font-fr);font-size:clamp(1.5rem,6vw,2rem);font-weight:700;color:var(--blue);line-height:1.1;text-align:left}
.ww-q .word .art{font-size:.65em;color:var(--muted)}
.ww-q .kana{color:var(--pink);font-weight:900;text-align:left;font-size:.95rem}
.ww-q:not(:has(.word)){padding:8px}
.wg-opts{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:12px;width:min(520px,100%)}
.wg-opts .choice{font-size:clamp(2.4rem,11vw,3.8rem);aspect-ratio:1.15}
.wg-pic{font-size:clamp(5rem,26vw,8rem);line-height:1;filter:drop-shadow(0 6px 0 rgba(0,0,0,.3))}
.wg-pic.small{font-size:clamp(3rem,14vw,4.2rem)}
.wg-pic .swatch{border-width:5px}
.wg-yn{display:flex;gap:18px}
.wg-yn button{width:clamp(96px,28vw,130px);aspect-ratio:1;border-radius:30px;font-size:clamp(3rem,13vw,4.4rem);border:4px solid #000;box-shadow:0 6px 0 #000;background:#fff}
.wg-yn button:active{transform:translateY(4px);box-shadow:0 2px 0 #000}
.wg-yn button.right{animation:yay .5s;background:#9DFF8A}
.wg-yn button.wrong{animation:shake .4s;opacity:.5}
/* mole */
.holes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 16px;width:min(460px,100%)}
.hole{position:relative;aspect-ratio:1;overflow:hidden;border-radius:16px}
.hole::after{content:"";position:absolute;left:4%;right:4%;bottom:0;height:30%;border-radius:50%;background:#3B2A1A;pointer-events:none}
.mole{position:absolute;left:12%;right:12%;bottom:8%;height:80%;border-radius:46% 46% 18% 18%;background:#fff;border:3px solid #000;display:grid;place-items:center;font-size:clamp(2rem,9vw,3rem);transform:translateY(115%);transition:transform .16s ease-out;z-index:1}
.mole.up{transform:translateY(0)}
.mole.bonk{background:#9DFF8A}
.mole.miss{background:#FF9A9A}
.ww-boss-prog{font-family:var(--font-pop);font-size:1.3rem;background:#fff;border:3px solid #000;border-radius:999px;padding:2px 14px}
/* feed */
.beltwrap{width:100%;overflow:hidden;padding:8px 0;background:rgba(0,0,0,.18);border-block:4px solid #000}
.belt{display:flex;gap:18px;width:max-content;animation:belt var(--dur) linear infinite}
@keyframes belt{to{transform:translateX(-50%)}}
.belt button{width:clamp(70px,19vw,90px);aspect-ratio:1;border-radius:22px;background:#fff;border:3px solid #000;box-shadow:0 4px 0 #000;font-size:clamp(2.2rem,10vw,3rem);display:grid;place-items:center;flex:none}
.belt button.gone{visibility:hidden}
.belt button.wrong{animation:shake .4s;background:#FF9A9A}
.ww-mimi{width:min(150px,22vh);height:auto;aspect-ratio:1;transform-origin:50% 100%}
.ww-mimi.munch{animation:munch .25s 3 alternate}
@keyframes munch{to{transform:scale(1.12,.88)}}
.flyer{position:fixed;z-index:45;font-size:3rem;line-height:1;transition:transform .45s cubic-bezier(.5,-.3,.6,1),opacity .45s;pointer-events:none}
/* paint */
.wg-paint{width:min(160px,28vh);height:auto}
.wg-paint .fillme{transition:fill .35s}
.pots{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:460px}
.pots button{width:clamp(64px,18vw,82px);aspect-ratio:1;border-radius:50%;border:4px solid #000;box-shadow:0 5px 0 #000;background:var(--sw)}
.pots button.wrong{animation:shake .4s;opacity:.4}
/* count */
.groups{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:12px;width:min(560px,100%)}
.groups button{min-height:120px;border-radius:22px;background:#fff;border:4px solid #000;box-shadow:0 5px 0 #000;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:2px;padding:8px;font-size:clamp(1.1rem,4.6vw,1.6rem);line-height:1.1}
.groups button.right{background:#9DFF8A;animation:yay .5s}
.groups button.wrong{background:#FF9A9A;animation:shake .4s}
/* which (A/B) */
.ab{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(520px,100%)}
.ab button{border-radius:22px;padding:12px 8px;background:#fff;border:4px solid #000;box-shadow:0 5px 0 #000;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .15s,background .15s}
.ab button .l{font-family:var(--font-pop);font-size:1.1rem;color:var(--muted)}
.ab button .w{font-family:var(--font-fr);font-weight:700;font-size:clamp(1.2rem,5.4vw,1.7rem);color:var(--blue);line-height:1.15;overflow-wrap:anywhere}
.ab button .k{color:var(--pink);font-weight:900;font-size:.85rem;min-height:1.2em}
.ab button.lit{transform:scale(1.07);background:#FFF2A8}
.ab button.right{background:#9DFF8A;animation:yay .5s}
.ab button.wrong{background:#FF9A9A;animation:shake .4s}
.speak.ww-ear{border:3px solid #000}
/* type the word */
.ty-word{font-family:var(--font-fr);font-weight:700;font-size:clamp(2.2rem,11vw,3.4rem);letter-spacing:.06em;background:#FFFBEA;border:4px solid #000;border-radius:18px;box-shadow:0 5px 0 #000;padding:4px 22px;color:var(--mf-ink);white-space:nowrap}
.ty-word .bl{display:inline-block;min-width:.7em;border-bottom:5px solid var(--mf-ink);color:var(--blue)}
.ty-word .bl.bad{color:var(--red)}
.ty-word .bl.cur{border-bottom-color:var(--red);animation:blink .8s steps(2) infinite}
@keyframes blink{50%{border-bottom-color:transparent}}
.kb{display:flex;flex-direction:column;gap:6px;width:min(520px,100%)}
.kb div{display:flex;gap:4px;justify-content:center}
.kb button{flex:1 1 0;max-width:46px;min-width:0;aspect-ratio:.9;border-radius:9px;background:#fff;border:3px solid #000;box-shadow:0 3px 0 #000;font-family:var(--font-pop);font-size:clamp(1rem,4.6vw,1.35rem);color:var(--mf-ink);padding:0}
.kb button.wide{max-width:76px;flex:1.6 1 0;background:#FFD1D1}
.kb button:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
/* UFO */
.ufo-zone{position:relative;width:min(540px,100%);height:clamp(210px,42vh,320px)}
.ufo{position:absolute;top:0;left:50%;transform:translateX(-50%);transition:left .35s ease-out;animation:hover 2.6s ease-in-out infinite alternate;z-index:2}
.ufo.lock{animation:none}
@keyframes hover{from{left:22%}to{left:78%}}
.ufo .ship{font-size:clamp(3.4rem,14vw,4.6rem);line-height:1;display:block;filter:drop-shadow(0 5px 0 rgba(0,0,0,.35))}
.ufo .beam{position:absolute;top:70%;left:50%;width:130px;height:var(--h,200px);transform:translateX(-50%);background:linear-gradient(rgba(255,255,170,.9),rgba(255,255,170,0));clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);opacity:0;transition:opacity .2s;z-index:-1}
.ufo.on .beam{opacity:1}
.ground{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:flex-end}
.gitem{font-size:clamp(2.6rem,12vw,3.6rem);line-height:1;padding:4px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35));transition:transform .55s ease-in,opacity .55s}
.gitem.wrong{animation:shake .4s}
/* match */
.mt{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 34px;align-items:center;width:min(500px,100%)}
.mt-col{display:flex;flex-direction:column;gap:12px}
.mt svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mt-w{position:relative;font-family:var(--font-fr);font-weight:700;font-size:clamp(1.15rem,5vw,1.5rem);background:#FFF1CF;border:4px solid #000;border-radius:14px;box-shadow:0 4px 0 #000;padding:8px 26px 8px 12px;text-align:left;color:var(--mf-ink)}
.mt-w i{position:absolute;right:-12px;top:50%;width:16px;height:16px;border-radius:50%;background:var(--mf-gold);border:3px solid #000;transform:translateY(-50%)}
.mt-p{font-size:clamp(2.2rem,10vw,2.9rem);line-height:1;width:clamp(76px,22vw,96px);aspect-ratio:1.2;border-radius:16px;background:#D9F3FF;border:4px solid #000;box-shadow:0 4px 0 #000;display:grid;place-items:center}
.mt-w.sel,.mt-p.sel{background:#FFE45C;transform:scale(1.05)}
.mt-w.ok,.mt-p.ok{background:#9DFF8A}
.mt-w.wrong,.mt-p.wrong{background:#FF9A9A;animation:shake .4s}
/* avoid the mistakes */
.sp-field{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;max-width:520px;padding:6px}
.sp-word{font-family:var(--font-pop);font-size:clamp(1.5rem,6.4vw,2.1rem);color:var(--mf-ink);background:#FFD6E7;border:4px solid #000;border-radius:18px;padding:8px 20px;box-shadow:0 5px 0 #000;transform:rotate(var(--r));animation:floaty 1.8s ease-in-out var(--d) infinite alternate}
@keyframes floaty{to{translate:0 -8px}}
.sp-word.right{background:#9DFF8A}
.sp-word.wrong{background:#FF3B3B;color:#fff;animation:shake .4s}
/* write the word */
.wr-paper{position:relative;width:min(520px,100%);height:clamp(150px,30vh,210px);background:#fff repeating-linear-gradient(transparent 0 38px,#B9C9F5 38px 40px);border:4px solid #000;border-radius:16px;box-shadow:0 6px 0 #000;transform:rotate(-1.5deg)}
.wr-cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.wr-pen{position:absolute;right:-6px;bottom:-14px;font-size:2.6rem;pointer-events:none;transform:rotate(10deg)}
.wr-meter{width:min(320px,80%);height:16px;border-radius:999px;background:rgba(0,0,0,.35);border:3px solid #000;overflow:hidden}
.wr-meter i{display:block;height:100%;width:0;background:linear-gradient(#9DFF8A,#22AE6B);transition:width .2s}
.wr-hint{font-family:var(--font-ja);font-weight:900;background:rgba(21,18,44,.85);color:#fff;border-radius:999px;padding:2px 14px;font-size:.9rem}
/* complete the sentence */
.se-hero{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.se-pic{position:relative;font-size:clamp(4.4rem,22vw,6.4rem);line-height:1;filter:drop-shadow(0 6px 0 rgba(0,0,0,.3))}
.se-pic .shades{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:.42em}
.se-pic .swatch{border-width:5px}
.se-bubble{background:#fff;border:4px solid #000;border-radius:20px;box-shadow:0 5px 0 #000;padding:12px 20px;font-family:var(--font-fr);font-weight:700;font-size:clamp(1.3rem,6vw,1.9rem);color:var(--mf-ink);max-width:min(420px,100%)}
.se-bubble .bl{display:inline-block;min-width:4ch;border-bottom:4px solid var(--mf-ink);color:var(--green)}
/* combo */
.mf-combo{font-family:var(--font-pop);font-size:clamp(3.6rem,18vw,6.4rem);line-height:1;color:var(--mf-hot);-webkit-text-stroke:5px #000;paint-order:stroke fill;text-shadow:0 7px 0 #000;transform:rotate(-7deg);animation:cmd .45s cubic-bezier(.3,1.7,.5,1)}
.mf-points{font-family:var(--font-pop);font-size:clamp(1.8rem,8vw,2.6rem);color:#fff;background:#FF8A1F;border:4px solid #000;border-radius:16px;padding:4px 18px;box-shadow:0 5px 0 #000;transform:rotate(-4deg);-webkit-text-stroke:1px #000}
@media (max-height:620px){ .wg-pic{font-size:4.2rem} .mf-play{padding-top:62px;gap:8px} .groups button{min-height:90px} .mf-bubble{font-size:3.4rem;padding:14px 24px} }

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
    .ww .belt{animation-duration:var(--dur)!important;animation-iteration-count:infinite!important}
}
</style>
</head>

let frVoice = null, voicesChecked = false, frVoices = [];
function voiceScore(v){
  let s = 0;
  if(/natural|neural/i.test(v.name)) s += 100;   // Edge: "Microsoft Denise Online (Natural)"
  if(/online/i.test(v.name)) s += 40;
  if(/google/i.test(v.name)) s += 30;            // Chrome: "Google français"
  if(/premium|enhanced|amélie|audrey|thomas/i.test(v.name)) s += 25; // Apple
  if(/fr[-_]FR/i.test(v.lang)) s += 10;
  if(/hortense|julie|paul/i.test(v.name) && !/natural/i.test(v.name)) s -= 20; // old Windows voices
  return s;
}
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  if(!vs.length) return;
  voicesChecked = true;

  const w = $('#voicewarn'); if(w) w.hidden = !!frVoice || recOk;

}

const REC = new Map();   // text -> {file, seg}
function buildRec(){
  THEMES.forEach(t=>t.items.forEach((it,i)=>REC.set(it.fr, {file:t.id, seg:SPRITES[t.id][i]})));
  PRAISE.forEach((p,i)=>REC.set(p, {file:'praise'+i}));

  REC.set("Bonjour ! Je m'appelle Mimi.", {file:'hello'});
  REC.set('Re-bonjour ! On y va ?', {file:'rehello'});
  REC.set(INTRO_LINE, {file:'intro'});
  REC.set("C'est parti !", {file:'parti'});
}
const INTRO_LINE = 'Salut Yui ! Alors, tu es prête à apprendre le français ?';
const recBufs = {}, recUrls = {};
let recOk = true, curSrc = null, curEl = null, curT = null;
function audioCtx(){ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function loadRec(file){
  if(!recBufs[file]) recBufs[file] = fetch(`audio/${file}.mp3`).then(r=>{ if(!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
    .then(b=>{ recUrls[file] = URL.createObjectURL(new Blob([b.slice(0)],{type:'audio/mpeg'})); return audioCtx().decodeAudioData(b); });
  return recBufs[file];
}
function preloadRec(){ Object.keys(SPRITES).concat(SINGLE_FILES).forEach(f=>loadRec(f).then(b=>{ recDur[f]=b.duration; }).catch(()=>{ recOk=false; })); }
function stopRec(){
  try{ curSrc && curSrc.stop(); }catch(e){} curSrc=null;
  if(curEl){ curEl.pause(); curEl=null; } clearTimeout(curT);
}
async function playRec(r, slow){
  const buf = await loadRec(r.file);
  stopRec();
  const [a,b] = r.seg || [0, buf.duration];
  if(slow){   // HTML audio keeps the pitch natural when slowed down
    const el = new Audio(recUrls[r.file]); el.preservesPitch = true; el.playbackRate = 0.7;
    el.currentTime = a; curEl = el; await el.play();
    curT = setTimeout(()=>{ if(curEl===el){ el.pause(); curEl=null; } }, (b-a)/0.7*1000 + 80);
    return;
  }
  const ctx = audioCtx(); if(ctx.state==='suspended') await ctx.resume();
  const src = ctx.createBufferSource(); src.buffer = buf; src.connect(ctx.destination);
  src.start(0, a, b-a); curSrc = src;
}
function useRec(){ return recOk; }
/* Speed-challenge voice lines (ElevenLabs · Clémence). Returns the clip length in ms. */
const recDur = {};

function say(text, slow){
  const r = REC.get(text);
  if(r && useRec()){
    try{ window.speechSynthesis && speechSynthesis.cancel(); }catch(e){}
    playRec(r, slow).catch(()=>{
      if(slow) playRec(r, false).catch(()=>{ recOk=false; ttsSay(text, slow); });
      else { recOk=false; ttsSay(text, slow); }
    });
    return;
  }
  ttsSay(text, slow);
}
function ttsSay(text, slow){
  stopRec();
  if(!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR'; if(frVoice) u.voice = frVoice;
    u.rate = slow ? 0.65 : 0.92; u.pitch = 1;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ============ SOUND FX ============ */
let actx;
function tone(freqs, dur=.12, type='sine', vol=.18){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime;
    freqs.forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type=type; o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t+i*dur);
      g.gain.exponentialRampToValueAtTime(vol,t+i*dur+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t+i*dur+dur);
      o.connect(g).connect(actx.destination); o.start(t+i*dur); o.stop(t+i*dur+dur+.05);
    });
  }catch(e){}
}
const sfx = {
  ok:()=>tone([660,880,1320],.09,'triangle'),
  no:()=>tone([240,190],.14,'sine',.12),
  pop:()=>tone([1200,500],.05,'square',.08),
  flip:()=>tone([520],.05,'triangle',.08),
  win:()=>tone([523,659,784,1047,784,1047],.11,'triangle'),
};

/* ============ CONFETTI ============ */
const fx = $('#fx'), ctx = fx.getContext('2d');
let parts = [], fxOn = false;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function confetti(n=120){
  if(reduce) return;
  fx.width = innerWidth*devicePixelRatio; fx.height = innerHeight*devicePixelRatio;
  const cols = ['#2F55D4','#EF4B4B','#FFC93C','#22AE6B','#FF73B0','#8A5CF0','#ffffff'];
  for(let i=0;i<n;i++) parts.push({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+4,c:pick(cols),a:Math.random()*6,va:(Math.random()-.5)*.4,life:0});
  if(!fxOn){ fxOn=true; requestAnimationFrame(tick); }
}
function tick(){
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  ctx.clearRect(0,0,innerWidth,innerHeight);
  parts.forEach(p=>{ p.vy+=.35; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.va; p.life++;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c; ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); ctx.restore(); });
  parts = parts.filter(p=>p.y<innerHeight+40 && p.life<240);
  if(parts.length) requestAnimationFrame(tick); else { fxOn=false; ctx.clearRect(0,0,innerWidth,innerHeight); }
}

/* ---------- LEARN ---------- */
function learn(tid){
  const t=T(tid); let i=0; const seen=new Set();
  screen(`${header(t,'learn')}<div class="stage">
    <div class="progress" id="prog"></div>
    <div class="card" id="card"></div>
    <div class="row">
      <button class="nav" id="prev">← まえ</button>
      <button class="speak" id="sp">🔊 きく</button>
      <button class="speak slow" id="slow">🐢 ゆっくり</button>
      <button class="nav go" id="next">つぎ →</button>
    </div></div>`);
  $('#backBtn').onclick=()=>openTheme(tid);
  function draw(){
    const it=t.items[i]; seen.add(i);
    $('#prog').innerHTML=t.items.map((_,k)=>`<i class="${seen.has(k)?'on':''} ${k===i?'cur':''}"></i>`).join('');
    const count = it.digit ? `<div class="count">${'🍓'.repeat(it.digit)}</div>` : '';
    $('#card').innerHTML=`<div class="bigpic" id="bp" title="タッチすると きこえるよ">${picHTML(it)}</div>${count}
      <div class="word">${wordHTML(it.fr)}</div><div class="kana">${kanaHTML(it)}</div><div class="ja">${esc(it.ja)}</div>`;
    $('#card').classList.remove('pop'); void $('#card').offsetWidth; $('#card').classList.add('pop');
    $('#bp').onclick=()=>say(it.fr);
    $('#prev').disabled = i===0;
    $('#next').textContent = i===t.items.length-1 ? 'おわり 🎉' : 'つぎ →';
    say(it.fr);
  }
  $('#sp').onclick=()=>say(t.items[i].fr);
  $('#slow').onclick=()=>say(t.items[i].fr,true);
  $('#prev').onclick=()=>{ if(i>0){i--; sfx.flip(); draw();} };
  $('#next').onclick=()=>{ if(i<t.items.length-1){ i++; sfx.flip(); draw(); } else finish(tid,'learn',2,`${t.items.length}この ことばを ぜんぶ みたよ!`); };
  draw();
}

/* ---------- QUIZ ---------- */
function quiz(tid){
  const t=T(tid); const rounds=shuffle(t.items).slice(0,Math.min(8,t.items.length));
  let r=0, score=0, tried=false, results=[];
  screen(`${header(t,'quiz')}<div class="stage">
    <div class="progress" id="prog"></div>
    <div class="ask"><button class="bigspeak" id="sp" aria-label="もういちど きく">🔊</button>
      <div class="word" id="w"></div><div class="kana" id="k"></div>
      <div class="row"><button class="speak slow" id="slow">🐢 ゆっくり</button></div></div>
    <div class="choices" id="ch"></div></div>`);
  $('#backBtn').onclick=()=>openTheme(tid);
  function draw(){
    const it=rounds[r]; tried=false;
    $('#prog').innerHTML=rounds.map((_,k)=>`<i class="${results[k]===true?'ok':results[k]===false?'on':''} ${k===r?'cur':''}"></i>`).join('');
    $('#w').innerHTML=wordHTML(it.fr); $('#k').textContent=S.kana?it.kana:'';
    const opts=shuffle([it,...shuffle(t.items.filter(x=>x!==it)).slice(0,3)]);
    $('#ch').innerHTML=opts.map((o,k)=>`<button class="choice" data-k="${k}" aria-label="${esc(o.ja)}">${picHTML(o)}</button>`).join('');
    $('#ch').querySelectorAll('.choice').forEach((b,k)=>b.onclick=()=>choose(b,opts[k]));
    const sp=$('#sp'); sp.classList.remove('ping'); void sp.offsetWidth; sp.classList.add('ping');
    setTimeout(()=>say(it.fr),250);
  }
  function choose(btn,o){
    const it=rounds[r];
    if(btn.classList.contains('wrong')||$('#ch .right')) return;
    if(o===it){
      btn.classList.add('right'); sfx.ok(); mimiJump();
      if(!tried){ score++; addStars(1); results[r]=true; } else results[r]=false;
      toast(`${praise()} ${pick(PRAISE_JA)}`);
      setTimeout(()=>{ r++; if(r<rounds.length) draw(); else finish(tid,'quiz',0,`${rounds.length}もんちゅう ${score}もん せいかい!`); },1400);
    }else{
      tried=true; btn.classList.add('wrong'); sfx.no(); toast('おしい! もういちど きいてみて 👂');
      setTimeout(()=>say(it.fr),500);
    }
  }
  $('#sp').onclick=()=>say(rounds[r].fr);
  $('#slow').onclick=()=>say(rounds[r].fr,true);
  draw();
}

/* ---------- MEMORY ---------- */
function memory(tid){
  const t=T(tid); const items=shuffle(t.items).slice(0,6);
  const cards=shuffle(items.flatMap((it,k)=>[{k,type:'pic',it},{k,type:'word',it}]));
  let open=[], lock=false, matched=0, moves=0;
  screen(`${header(t,'memory')}<div class="stage">
    <p class="sub" style="margin:0">えと フランスごの ことばを ペアに しよう! <b id="mv"></b></p>
    <div class="mgrid" id="g">${cards.map((c,i)=>`<button class="mcard" data-i="${i}" aria-label="カード ${i+1}"><span class="in">
      <span class="b">?</span>
      <span class="f">${c.type==='pic'?picHTML(c.it):`<span class="w">${esc(c.it.fr)}${S.kana?`<small>${esc(c.it.kana)}</small>`:''}</span>`}</span>
    </span></button>`).join('')}</div></div>`);
  $('#backBtn').onclick=()=>openTheme(tid);
  app.querySelectorAll('.mcard').forEach(el=>el.onclick=()=>{
    const c=cards[+el.dataset.i];
    if(lock||el.classList.contains('flip')) return;
    el.classList.add('flip'); sfx.flip(); say(c.it.fr);
    open.push({el,c});
    if(open.length===2){
      moves++; $('#mv').textContent=`(${moves}かい)`;
      const [a,b]=open; open=[];
      if(a.c.k===b.c.k){
        matched++;
        setTimeout(()=>{ a.el.classList.add('match'); b.el.classList.add('match'); sfx.ok(); mimiJump();
          if(matched===items.length) setTimeout(()=>finish(tid,'memory',3,`${moves}かいで ぜんぶ そろったよ!`),600);
          else toast(`${praise()} ${esc(a.c.it.ja)} = ${a.c.it.fr}`); },450);
      }else{
        lock=true; setTimeout(()=>{ a.el.classList.remove('flip'); b.el.classList.remove('flip'); lock=false; },1100);
      }
    }
  });
}

/* Plausible misspellings for "Évite les erreurs !" */
function misspell(w, n){
  const out = new Set(), V='aeiou', isL=ch=>/[a-z]/.test(ch);
  const ops = [
    s=>{ const i=Math.random()*(s.length-1)|0; if(!isL(s[i])||!isL(s[i+1])||s[i]===s[i+1]) return null; return s.slice(0,i)+s[i+1]+s[i]+s.slice(i+2); },
    s=>{ const ix=[...s].map((c,i)=>V.includes(c)?i:-1).filter(i=>i>=0); if(!ix.length) return null; const i=pick(ix); return s.slice(0,i)+pick([...V].filter(v=>v!==s[i]))+s.slice(i+1); },
    s=>{ const ix=[...s].map((c,i)=>isL(c)&&!V.includes(c)?i:-1).filter(i=>i>=0); if(!ix.length) return null; const i=pick(ix); return s.slice(0,i+1)+s[i]+s.slice(i+1); },
    s=>{ if(s.length<4) return null; const i=1+(Math.random()*(s.length-1)|0); if(!isL(s[i])) return null; return s.slice(0,i)+s.slice(i+1); },
    s=>{ const e=s[s.length-1]; return e==='e' ? s.slice(0,-1)+pick(['é','a']) : isL(e) ? s+pick(['e','s','t']) : null; },
  ];
  for(let k=0;k<80 && out.size<n;k++){ const r=pick(ops)(w); if(r && r!==w && r.length>1) out.add(r); }
  return [...out];
}

function moleGame(c, rounds){
  const cast = c.opts(Math.min(6, c.n+2));
  let hits = 0;
  c.arena.innerHTML=`${c.q(true)}${rounds>1?'<div class="ww-boss-prog" id="bprog"></div>':''}
    <div class="holes">${[0,1,2,3,4,5].map(()=>`<div class="hole"><button class="mole" aria-label="もぐら"></button></div>`).join('')}</div>`;
  const moles=[...c.arena.querySelectorAll('.mole')], up=new Map(); let sinceT=0;
  const prog=()=>{ const p=$('#bprog',c.arena); if(p) p.textContent='👑 '+'🔨'.repeat(hits)+'⬜'.repeat(rounds-hits); };
  prog();
  function pop(){
    const free=moles.filter(m=>!up.has(m)); if(free.length){
      const m=pick(free);
      const shown=[...up.values()];
      const it = (!shown.includes(c.target) && (sinceT>=1 || Math.random()<.45)) ? c.target : pick(cast.filter(x=>x!==c.target && !shown.includes(x))) || c.target;
      sinceT = it===c.target ? 0 : sinceT+1;
      m.innerHTML=picHTML(it); m.className='mole up'; up.set(m,it);
      c.later(()=>{ if(up.get(m)===it){ m.classList.remove('up'); up.delete(m); } }, 1250*c.f);
    }
    c.later(pop, 620*c.f);
  }
  moles.forEach(m=>m.onclick=()=>{
    if(c.done||!up.has(m)) return;
    const it=up.get(m); up.delete(m);
    if(it===c.target){
      m.classList.add('bonk'); sfx.pop(); hits++; prog();
      setTimeout(()=>m.classList.remove('up'),250);
      if(hits>=rounds) return c.win();
      sfx.ok(); c.setTarget(pick(cast.filter(x=>x!==c.target)));
    }else{ m.classList.add('miss'); c.lose(); }
  });
  c.later(pop, 500);
}

/* ---------- music: an original chiptune loop, synthesized live (speeds up with each level) ---------- */
const MUSIC = (()=>{
  let bus=null, timer=null, next=0, step=0, bpm=128, mode='main', noise=null;
  const hz = m => 440*Math.pow(2,(m-69)/12);
  const SONG = {
    main:{ chords:[48,45,41,43], lead:[[76,79,84,79,76,79,81,79],[76,72,76,81,79,76,72,74],[77,81,84,81,79,77,76,77],[79,83,86,83,79,null,74,79]] },
    boss:{ chords:[45,41,43,40], lead:[[69,72,76,72,69,72,76,77],[77,76,74,72,74,76,77,null],[79,76,72,76,79,81,79,76],[76,75,76,null,71,null,76,null]] },
    title:{ chords:[48,53,45,43], lead:[[72,null,76,79,null,76,72,null],[77,null,81,84,null,81,77,null],[76,null,72,69,null,72,76,null],[74,null,79,83,86,null,null,null]] },
  };
  function voice(f,t,d,type,vol){
    const c=audioCtx(), o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(bus); o.start(t); o.stop(t+d+.02);
  }
  function hit(t,kind){
    const c=audioCtx();
    if(kind==='kick'){ const o=c.createOscillator(), g=c.createGain(); o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(45,t+.12);
      g.gain.setValueAtTime(.5,t); g.gain.exponentialRampToValueAtTime(.0001,t+.15); o.connect(g).connect(bus); o.start(t); o.stop(t+.16); return; }
    if(!noise){ noise=c.createBuffer(1,c.sampleRate*.25,c.sampleRate); const d=noise.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
    const s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain(); s.buffer=noise;
    f.type= kind==='hat'?'highpass':'bandpass'; f.frequency.value= kind==='hat'?7000:1800;
    const d= kind==='hat'?.04:.12; g.gain.setValueAtTime(kind==='hat'?.12:.3,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(f).connect(g).connect(bus); s.start(t); s.stop(t+d+.02);
  }
  function schedule(s,t){
    const song=SONG[mode], bar=s>>3, e=s&7, d=60/bpm/2;
    const n=song.lead[bar][e]; if(n) voice(hz(n),t,d*.9,'square',.09);
    voice(hz(song.chords[bar]-12+(e%2?12:0)),t,d*.85,'triangle',.22);
    if(e%4===0) hit(t,'kick'); if(e%4===2) hit(t,'snare'); hit(t,'hat');
  }
  function tick(){ const c=audioCtx(); while(next<c.currentTime+.12){ schedule(step,next); next+=60/bpm/2; step=(step+1)%32; } }
  return {
    get on(){ return !!timer; },
    start(m){
      if(m) mode=m;
      if(!S.ww.music) return;
      try{
        const c=audioCtx(); if(c.state==='suspended') c.resume();
        if(!bus){ bus=c.createGain(); bus.gain.value=.22; bus.connect(c.destination); }
        if(timer) return;
        next=c.currentTime+.06; step=0; timer=setInterval(tick,25);
      }catch(e){}
    },
    stop(){ clearInterval(timer); timer=null; },
    mode(m){ if(m!==mode){ mode=m; step=0; } },
    tempo(b){ bpm=b; },
    duck(ms){ if(!bus) return; const c=audioCtx(), t=c.currentTime; bus.gain.cancelScheduledValues(t); bus.gain.setTargetAtTime(.07,t,.05); bus.gain.setTargetAtTime(.22,t+ms/1000,.2); },
  };
})();

function wwPool(){ return WORDS.slice(0, Math.min(WORDS.length, S.ww.known)); }
function wwClear(){ if(!R) return; R.timers.forEach(clearTimeout); R.timers=[]; cancelAnimationFrame(R.raf); R.keyh=null; R.tok++; }

function wwVoice(n){
  const f='ww_'+n; if(!useRec()) return 0;
  const ms=wwVoiceDur(n); MUSIC.duck(ms);
  loadRec(f).then(b=>{ recDur[f]=b.duration; return playRec({file:f}); }).catch(()=>{});
  return ms;
}

function wwNext(){

  else{

function wwPlay(g, all){
  wwClear();
  const pool = g.pool ? g.pool(all) : all;
  const f = g.boss ? Math.max(.75, 1-.04*R.level) : Math.max(.55, 1-.08*R.level);
  const time = Math.max(g.minT||0, g.t * f);
  let target = pool.find(x=>x===R.focus[0]) || pick(pool);
  if(target===R.focus[0]) R.focus.shift();
  const a=$('#wwA'); a.className='ww-arena '+g.bg;
  a.innerHTML=`<div class="mf-title">${esc(g.fr)}<small>${g.ja}</small></div><div class="mf-clock" id="wwC"><i></i><span>${Math.ceil(time)}</span></div><div class="mf-play"></div>`;
  $('#wwB').classList.remove('idle');
  const play=$('.mf-play',a);
  const c = {
    arena:play, pool, f, time, done:false,
    get target(){ return target; },
    n: Math.min(6, 3+Math.floor(R.level/2)),
    later: wwLater,
    key(fn){ R.keyh=fn; },
    opts(k){ return shuffle([target, ...shuffle(pool.filter(x=>x!==target)).slice(0, Math.max(1,k-1))]); },
    q(word){ return `<div class="ww-q"><button class="bigspeak ww-ear" aria-label="もういちど きく">🔊</button>${word?`<div><div class="word">${wordHTML(target.fr)}</div><div class="kana">${S.kana?esc(target.kana):''}</div></div>`:''}</div>`; },
    bind(sel, list, fn){ play.querySelectorAll(sel).forEach((b,k)=>b.onclick=()=>{ if(!c.done) fn(b, list[k]); }); },
    setTarget(t, quiet){ target=t; if(quiet) return; const w=$('.ww-q .word',play), k=$('.ww-q .kana',play); if(w) w.innerHTML=wordHTML(t.fr); if(k) k.textContent=S.kana?t.kana:''; setTimeout(()=>say(t.fr),300); },
    win(delay=350){ if(c.done) return; c.done=true; wwFreeze(); sfx.ok(); setTimeout(()=>wwEnd(true,g,target), delay); },
    lose(){ if(c.done) return; c.done=true; wwFreeze(); sfx.no(); setTimeout(()=>wwEnd(false,g,target), 500); },
    replay:null,
  };
  R.c=c; S.ww.games[g.id]=true; save();
  g.run(c);
  play.querySelectorAll('.ww-ear').forEach(b=>b.onclick=()=>{ if(c.replay) c.replay(); else say(target.fr); });
  if(!g.selfSpeak) wwLater(()=>say(target.fr), 250);
  // timer: clock + bottom bar (JS-driven so it still works with reduced motion)
  const bar=$('#wwB .ww-bar i'), num=$('#wwC span'), secs=$('#wwT'), t0=performance.now(), tok=R.tok; let shown=-1;
  (function step(now){
    if(!R || R.tok!==tok || c.done) return;
    const left=Math.max(0, time-(now-t0)/1000), s=Math.ceil(left);
    bar.style.width=(left/time*100)+'%';
    if(s!==shown){ shown=s; num.textContent=s; secs.textContent=String(s).padStart(2,'0');
      const hurry=s<=2; $('#wwC').classList.toggle('hurry',hurry); $('#wwB .ww-bar').classList.toggle('hurry',hurry);
      if(hurry && s>0) tone([880],.05,'square',.05); }
    if(left<=0){ c.lose(); return; }
    R.raf=requestAnimationFrame(step);
  })(t0);
}
function wwFreeze(){ if(!R) return; cancelAnimationFrame(R.raf); R.timers.forEach(clearTimeout); R.timers=[]; R.keyh=null; R.tok++;
  $('#wwC')?.classList.remove('hurry'); $('#wwB .ww-bar')?.classList.remove('hurry'); }

/* ---------- launch animation ---------- */
function splash(){
  const el=$('#splash'), go=$('#spGo'), yes=$('#spYes'), mimi=$('#spMimi'), bub=$('#spBubble'), fr=$('#spFr');
  let typeT;
  function close(){ clearInterval(typeT); el.classList.add('out'); setTimeout(()=>el.remove(),650); }
  $('#spSkip').onclick=()=>{ stopRec(); close(); };
  go.onclick=async()=>{
    go.hidden=true; sfx.flip(); el.classList.add('talking');
    mimi.classList.add('talk'); bub.hidden=false;
    let dur=3.8; try{ dur=(await loadRec('intro')).duration; }catch(e){}
    say(INTRO_LINE);
    const chars=[...INTRO_LINE]; let i=0;
    typeT=setInterval(()=>{ fr.textContent=chars.slice(0,++i).join(''); if(i>=chars.length) clearInterval(typeT); }, Math.max(25, dur*900/chars.length));
    setTimeout(()=>{ mimi.classList.remove('talk'); $('#spJa').hidden=false; yes.hidden=false; yes.focus(); }, dur*1000+150);
  };
  yes.onclick=()=>{
    yes.disabled=true; say("C'est parti !"); sfx.win(); confetti(160);
    mimi.classList.remove('talk'); mimi.classList.add('hop');
    setTimeout(close,1100);
  };
}

buildRec(); preloadRec();
updateStars(false);
home();
splash();
</script>
